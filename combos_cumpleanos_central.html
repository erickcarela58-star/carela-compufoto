<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="0;url=/combos.html">
<link rel="canonical" href="https://dcarelacompufoto.com/combos.html">
<title>Catálogo actualizado · D' Carela Compufoto</title>
<script>
(function(){
  var file=decodeURIComponent(location.pathname.split('/').pop()||'').toLowerCase();
  var categories=['xv','infantil','graduacion','cumpleanos','embarazadas'];
  var category=categories.find(function(value){return file.indexOf('combos_'+value+'_')===0;})||'';
  var target=new URL('/combos.html',location.origin);
  new URLSearchParams(location.search).forEach(function(value,key){if(key!=='cat')target.searchParams.append(key,value);});
  if(category)target.searchParams.set('cat',category);
  target.hash=location.hash;
  location.replace(target.href);
})();
</script>
</head>
<body>
<p>Este catálogo fue sustituido. <a href="/combos.html">Abrir el catálogo oficial actualizado</a>.</p>
</body>
</html>
