<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>D'Carela · Proveedores de IA</title>
  <script src="./crm-config.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #0b0b0d; color: #f5f5f5; }
    main { max-width: 1180px; margin: auto; padding: 24px; }
    .muted { color: #a3a3a3; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 16px; }
    .card { background: #151518; border: 1px solid #29292f; border-radius: 16px; padding: 16px; }
    label { display: block; margin: 10px 0 4px; font-size: 13px; color: #d4d4d8; }
    input, select, textarea, button {
      width: 100%; box-sizing: border-box; border-radius: 10px;
      border: 1px solid #3f3f46; background: #0f0f12; color: #fff;
      padding: 10px 12px;
    }
    textarea { min-height: 92px; resize: vertical; }
    button { cursor: pointer; background: #f5f5f5; color: #111; font-weight: 700; margin-top: 12px; }
    button.secondary { background: #242429; color: #fff; }
    pre { white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }
    .status { padding: 10px 12px; border-radius: 10px; background: #202026; margin: 12px 0; }
  </style>
</head>
<body>
<main>
  <h1>Proveedores de IA</h1>
  <p class="muted">Configura cualquier API. Las claves se envían al backend y se guardan cifradas.</p>
  <div id="status" class="status">Iniciando…</div>

  <div class="grid">
    <section class="card">
      <h2>Proveedor</h2>
      <label>Nombre</label><input id="name" placeholder="openrouter-main">
      <label>Tipo</label>
      <select id="type">
        <option>openai</option><option>openrouter</option><option>anthropic</option>
        <option>gemini</option><option>openai_compatible</option>
        <option>local</option><option>custom_rest</option>
      </select>
      <label>URL base</label><input id="baseUrl" placeholder="https://api.example.com">
      <label>Endpoint</label><input id="endpoint" placeholder="/v1/chat/completions">
      <label>Referencia del secreto</label><input id="secretRef" placeholder="proveedor_principal">
      <label>API key</label><input id="secretValue" type="password" autocomplete="new-password">
      <label>Headers JSON</label><textarea id="headers">{}</textarea>
      <label><input id="allowLocal" type="checkbox" style="width:auto"> Permitir servidor local</label>
      <button id="saveProvider">Guardar proveedor</button>
      <button id="saveSecret" class="secondary">Guardar/rotar API key</button>
    </section>

    <section class="card">
      <h2>Modelo</h2>
      <label>ID del proveedor</label><input id="modelProviderId">
      <label>Modelo</label><input id="modelKey" placeholder="gpt-5.4">
      <label>Nombre visible</label><input id="modelName">
      <label>Parámetros JSON</label><textarea id="modelParams">{}</textarea>
      <button id="saveModel">Guardar modelo</button>
    </section>

    <section class="card">
      <h2>Ruta por módulo</h2>
      <label>Módulo</label><input id="moduleKey" placeholder="crm">
      <label>Operación</label><input id="operationKey" placeholder="reply_draft">
      <label>ID del modelo primario</label><input id="routeModelId">
      <label>Parámetros JSON</label><textarea id="routeParams">{}</textarea>
      <button id="saveRoute">Guardar ruta</button>
    </section>

    <section class="card">
      <h2>Catálogo</h2>
      <button id="refresh" class="secondary">Actualizar catálogo</button>
      <pre id="catalog">Sin cargar.</pre>
    </section>
  </div>
</main>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const config = window.CRM_CONFIG || {};
  const status = document.getElementById("status");
  const catalog = document.getElementById("catalog");
  const sb = createClient(config.supabaseUrl || "", config.supabaseAnonKey || "");

  function value(id) { return document.getElementById(id).value.trim(); }
  function json(id) { return JSON.parse(value(id) || "{}"); }
  function setStatus(message) { status.textContent = message; }

  async function invoke(body) {
    const { data: sessionData } = await sb.auth.getSession();
    const token = sessionData.session?.access_token;
    if (!token) throw new Error("Inicia sesión como administrador.");

    const response = await fetch(
      `${config.supabaseUrl}/functions/v1/ai-gateway-admin`,
      {
        method: "POST",
        headers: {
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify(body),
      },
    );

    const result = await response.json();
    if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
    return result;
  }

  async function refresh() {
    setStatus("Cargando catálogo…");
    const result = await invoke({ action: "catalog" });
    catalog.textContent = JSON.stringify(result, null, 2);
    setStatus("Catálogo actualizado.");
  }

  document.getElementById("refresh").onclick = () =>
    refresh().catch((error) => setStatus(error.message));

  document.getElementById("saveSecret").onclick = async () => {
    try {
      setStatus("Guardando clave cifrada…");
      const result = await invoke({
        action: "save_secret",
        reference_name: value("secretRef"),
        secret_value: value("secretValue"),
      });
      document.getElementById("secretValue").value = "";
      setStatus(`Clave guardada: ${result.masked}`);
      await refresh();
    } catch (error) {
      setStatus(error.message);
    }
  };

  document.getElementById("saveProvider").onclick = async () => {
    try {
      await invoke({
        action: "upsert_provider",
        secret_reference: value("secretRef"),
        provider: {
          name: value("name"),
          provider_type: value("type"),
          base_url: value("baseUrl"),
          endpoint: value("endpoint"),
          default_headers: json("headers"),
          allow_local: document.getElementById("allowLocal").checked,
          active: true,
        },
      });
      setStatus("Proveedor guardado.");
      await refresh();
    } catch (error) {
      setStatus(error.message);
    }
  };

  document.getElementById("saveModel").onclick = async () => {
    try {
      await invoke({
        action: "upsert_model",
        model: {
          provider_id: value("modelProviderId"),
          model_key: value("modelKey"),
          display_name: value("modelName"),
          default_parameters: json("modelParams"),
          active: true,
        },
      });
      setStatus("Modelo guardado.");
      await refresh();
    } catch (error) {
      setStatus(error.message);
    }
  };

  document.getElementById("saveRoute").onclick = async () => {
    try {
      await invoke({
        action: "upsert_route",
        route: {
          module_key: value("moduleKey"),
          operation_key: value("operationKey"),
          primary_model_id: value("routeModelId"),
          default_parameters: json("routeParams"),
          active: true,
        },
      });
      setStatus("Ruta guardada.");
      await refresh();
    } catch (error) {
      setStatus(error.message);
    }
  };

  refresh().catch((error) => setStatus(error.message));
</script>
</body>
</html>
